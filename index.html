<!DOCTYPE html>
<html>
<head>
    <title>Грузоперевозки</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="font-family: Arial; background: #f0f2f5; padding: 20px; text-align: center;">
    <h1 style="color: #333;">🚚 Грузоперевозки</h1>
    <p>Выберите действие:</p>
    
    <button onclick="getOrders()" style="background: #667eea; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-size: 16px; margin-bottom: 10px; cursor: pointer;">📋 Мои заявки</button>
    
    <button onclick="getProfit()" style="background: #667eea; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-size: 16px; cursor: pointer;">💰 Профит за неделю</button>
    
    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        
        function getOrders() {
            Telegram.WebApp.sendData('get_orders');
        }
        
        function getProfit() {
            Telegram.WebApp.sendData('get_profit');
        }
    </script>
</body>
</html>
