<!DOCTYPE html>
<html>
<head>
    <title>Грузоперевозки</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .btn { background: #667eea; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-size: 16px; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🚚 Грузоперевозки</h1>
    <button class="btn" onclick="Telegram.WebApp.sendData('get_orders'); Telegram.WebApp.close();">📋 Мои заявки</button>
    <button class="btn" onclick="Telegram.WebApp.sendData('get_profit'); Telegram.WebApp.close();">💰 Профит</button>
    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
